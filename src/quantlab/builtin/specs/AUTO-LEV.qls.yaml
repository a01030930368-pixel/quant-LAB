# Generator spec of the automatic strategy search for 3배 ETF. Its parameters pick one building block
# from each list (quantlab.strategies.combo, catalog 2: the 1x groups'
# catalog 1 plus deeper thresholds, wider stops/takes and SPY market filters); every combination is one registered trial.
# The search runs on TRAIN+VALIDATION only. A candidate is this spec with its parameters fixed
# (후보 확정), and only the user starts its final evaluation.
spec_version: 1
strategy:
  id: AUTO-LEV
  version: 1.0.0
  name: 자동 탐색 · 3배 ETF
  type: mean_reversion
  author: claude
  parent: null
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Short-horizon swing rules (oversold rebounds, moving-average and MACD signals) on 3x leveraged non-US index ETFs (emerging markets, China large caps, Korea, developed Europe), which move about three times as much as the 1x country ETFs whose edges did not cover the costs.
    No single rule is claimed in advance: the search tests a fixed grid and only combinations that
    clear cost, consistency and multiple-testing filters become candidates.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count)
    - legs are correlated; several ETFs signal on the same day
    - 0.6% round-trip cost removes small edges
    - daily-reset 3x funds decay in sideways markets and can fall 60%+ in a crash
  falsification: >
    On the holdout (2020-01 onward), net Sharpe not above SPY buy-and-hold with block-bootstrap
    p < 0.10, or max drawdown above 80% of SPY's.
universe:
  market: US_ETF
  symbols: [EDC, YINN, KORU, EURL, SPY, BIL]
  frequency: daily
rules:
  kind: declarative
  combo:
    catalog: 2
    trade: [EDC, YINN, KORU, EURL]
    slots: 4
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
parameters:
  entry: {default: z20_1.5, search: [z20_1.5, z20_2.0, z20_2.5, z20_3.0, rsi2_2, rsi2_5, rsi2_10, rsi2_15, down3, down4, down5, down6, ret5_3, ret5_5, ret5_8, ret5_12, ret5_15, ret10_5, ret10_8, ret10_12, ret10_16, ret10_20, low20, low60, low120, ibs_0.05, ibs_0.1, ibs_0.2, below5_2, below5_4, below5_6, below20_4, below20_7, below20_10, below20_15, below60_7, below60_12, below60_16, below60_20, below120_10, below120_15, below120_20, below120_25, golden5_20, golden20_60, golden60_120, breakup20, breakup60, breakup120, macd_up, macd_up_neg, rsi14_30, rsi14_25, rsi14_20, ret20_10, ret20_15, ret20_20]}
  filter: {default: none, search: [none, up200, up120, aligned, down200, macd_pos, up60, macd_neg, spy_up200, spy_down200]}
  exit: {default: none, search: [none, above5, above10, above20, rsi2_70, macd_dn, below20, rsi2_50, rsi2_90, high5]}
  max_hold: {default: 5, search: [3, 5, 10, 20, 30]}
  stop: {default: 0, search: [0, 0.1, 0.2]}
  take: {default: 0, search: [0, 0.1, 0.2, 0.3]}
benchmark: SPY_buy_and_hold
costs: {one_way_bps: 30}   # informational; the validation policy's costs are binding
validation:
  policy: auto_lev_v1
