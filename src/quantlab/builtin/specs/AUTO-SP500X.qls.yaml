# Generator spec of the automatic research factory on S&P 500 stocks (D-033). Catalog 3 widens
# AUTO-SP500's catalog 1: 13 more conditions in 4 more groups (earnings disappointment, one large
# insider purchase, opening gap down, SPY below its 200-day average or down 5% in five days, 52-week
# low, a one-day drop, a 20-day drop, down streaks, a volatility squeeze), a 3-session hold and
# 5 slots. Combinations made only of catalog-1 items with catalog-1 exits were run by AUTO-SP500;
# the search skips them and counts them as prior trials. The search runs on TRAIN+VALIDATION only;
# the 2020+ holdout of the S&P 500 stocks was spent by GAP-EARN-SP500, so a candidate's verdict
# comes from forward paper trading, never from the holdout.
spec_version: 1
strategy:
  id: AUTO-SP500X
  version: 1.0.0
  name: 자동 연구 공장 · S&P 500 종목
  type: event
  author: claude
  parent: AUTO-SP500@1.0.0
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    AUTO-SP500 found no combination of 15 stock conditions that cleared costs and the trial count;
    its near misses clustered on opening gaps after earnings. The wider catalog adds the opposite
    side of each event (disappointments, gaps down, 52-week lows, down streaks, market stress) and a
    quiet-before-the-move state (volatility squeeze), so reversal ideas get the same chance as
    continuation ones. No single rule is claimed in advance.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count, now over 580,000)
    - signals bunch on market-wide days (earnings seasons, sell-offs), so trades are not independent
    - 0.6% round-trip cost removes small edges
    - holding SPY between trades adds its drawdowns to the rule's
    - the price bundle and SEC filings are free sources checked only by counts
  falsification: >
    On forward data after the candidate is fixed, net Sharpe not above SPY buy-and-hold, or max
    drawdown above 80% of SPY's.
universe:
  market: US_STOCK
  index: SP500
  symbols: [SPY, BIL]
  frequency: daily
rules:
  kind: declarative
  stock_combo:
    catalog: 3
    park: SPY                  # equity not in a position is held in SPY
    park_band: 2               # SPY is bought back only once two slots' worth of cash is idle
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
