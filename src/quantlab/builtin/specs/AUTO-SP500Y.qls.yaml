# Generator spec of the research factory's round 2 on S&P 500 stocks (D-034). Catalog 4 adds new
# information to catalog 3: joining or leaving the S&P 500 within 20 sessions, three or more officers
# or directors selling $100k+ within 30 days, no insider sale in 90 days, and the weeks before the next
# earnings report (80-88 days after the last one). Combinations made only of catalog-3 items and exits
# were run by AUTO-SP500 and AUTO-SP500X; the search skips them and counts them as prior trials.
# TRAIN+VALIDATION only; the 2020+ holdout of these stocks was spent by GAP-EARN-SP500, so a
# candidate's verdict comes from forward paper trading, never from the holdout.
spec_version: 1
strategy:
  id: AUTO-SP500Y
  version: 1.0.0
  name: 자동 연구 공장 2차 · S&P 500 종목
  type: event
  author: claude
  parent: AUTO-SP500X@1.0.0
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Rounds of AUTO-SP500 and AUTO-SP500X tried about 540,000 combinations of price, insider-purchase
    and earnings-reaction conditions without a candidate; their near misses were market sell-off
    rebounds and gaps. Round 2 adds information those rounds never used: index inclusion and
    deletion (forced buying and selling by index funds), clustered insider selling and its absence,
    and the run-up to the next earnings report. No single rule is claimed in advance.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count, now over 900,000)
    - signals bunch on market-wide days (earnings seasons, sell-offs), so trades are not independent
    - 0.6% round-trip cost removes small edges
    - holding SPY between trades adds its drawdowns to the rule's
    - the price bundle and SEC filings are free sources checked only by counts
  falsification: >
    On forward data after the candidate is fixed, net Sharpe not above SPY buy-and-hold, or max
    drawdown above 80% of SPY's.
universe:
  market: US_STOCK
  index: SP500
  symbols: [SPY, BIL]
  frequency: daily
rules:
  kind: declarative
  stock_combo:
    catalog: 4
    park: SPY                  # equity not in a position is held in SPY
    park_band: 2               # SPY is bought back only once two slots' worth of cash is idle
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
