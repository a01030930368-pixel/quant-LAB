# Generator spec of the research factory's round 3: Korean stocks (D-038). The user chose Korean stocks
# after every S&P 500 line failed at 0.6% round trips; a KRX round trip costs about 0.43% (commission
# 0.015% each way, 0.20% securities transaction tax on sales, 0.10% slippage each way). Catalog 5: the
# price items of catalog 3 without the SPY ones, the same market filters on KODEX 200, and closes at
# the daily price limit. Universe KRTOP300 (the 300 largest common stocks of KOSPI and KOSDAQ, point in
# time, delisted names included; quantlab.data.kr_stocks). TRAIN+VALIDATION only.
spec_version: 1
strategy:
  id: AUTO-KRSTK
  version: 1.0.0
  name: 자동 연구 공장 3차 · 한국 주식
  type: event
  author: claude
  parent: null
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Rebounds after sharp falls and gap moves left a gross edge in US stocks that a 0.6% round trip
    removed. Korean stocks cost less to trade, have a larger share of individual investors, and stop at
    a daily price limit, so over- and under-reactions may be larger and cheaper to trade. No single
    rule is claimed in advance: the search tests a fixed grid and only combinations that clear cost,
    consistency and multiple-testing filters become candidates.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count)
    - signals bunch on market-wide days, so trades are not independent
    - the transaction tax was higher before 2023 (0.23-0.30%); the 2026 rate is applied to every year
    - dividends are left out of both the stocks and KODEX 200 (price returns)
    - the KOSPI's path was already seen through KORU (AUTO-LEV/LEVP) and the KRX 2x ETFs (AUTO-KR2X)
    - the exchange's snapshots are checked only by counts and a basket correlation
  falsification: >
    On the holdout (2020-01 onward) or forward data, net Sharpe not above KODEX 200 buy-and-hold with
    block-bootstrap p < 0.10, or max drawdown above 80% of KODEX 200's.
universe:
  market: KR_STOCK
  index: KRTOP300
  symbols: ["069500"]
  frequency: daily
rules:
  kind: declarative
  stock_combo:
    catalog: 5
    park: "069500"             # equity not in a position is held in KODEX 200
    park_band: 2               # bought back only once two slots' worth of cash is idle
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
