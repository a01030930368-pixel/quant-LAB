# Generator spec of the research factory's round 4: Korean stocks with Korean filings (D-040). Round 3
# (AUTO-KRSTK, price items only) tried 276,210 combinations with no candidate, and its pre-fixed rule failed
# the final evaluation (D-039), so the KRTOP300 holdout (2020+) is spent: this round searches 2014-08 to
# 2019 and a passing rule is judged on forward paper data only. Catalog 6: catalog 5 plus seven OpenDART
# items (holdings reported up or down by executives and major shareholders; buyback decisions and trust
# contracts, served from 2015). Only combinations with at least one new item are run; the others are
# AUTO-KRSTK's (already_tried).
spec_version: 1
strategy:
  id: AUTO-KRDART
  version: 1.0.0
  name: 자동 연구 공장 4차 · 한국 공시
  type: event
  author: claude
  parent: AUTO-KRSTK@1.0.0
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Insiders know their company best, and a buyback is the company buying its own shares: both are
    information the price alone does not carry. In US stocks, filings (earnings reactions, insider
    purchases) left larger gross edges than price rules. Korean executives and major shareholders
    must report changes in their holdings within days, and buyback decisions are disclosed the day the
    board decides. No single rule is claimed in advance: the search tests a fixed grid and only
    combinations that clear cost, consistency and multiple-testing filters become candidates.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count, round 3 included)
    - a holding report does not say why it changed (option exercises, new shares, gifts count too)
    - buyback decisions are served from 2015 only, so their TRAIN span is short
    - delisted companies may lack a DART company code, so their filings can be missing
    - the KRTOP300 holdout was read (D-039): only forward paper data can confirm a rule
  falsification: >
    On forward data from its start, net Sharpe not above KODEX 200 buy-and-hold, or max drawdown above
    80% of KODEX 200's.
universe:
  market: KR_STOCK
  index: KRTOP300
  symbols: ["069500"]
  frequency: daily
rules:
  kind: declarative
  stock_combo:
    catalog: 6
    park: "069500"             # equity not in a position is held in KODEX 200
    park_band: 2               # bought back only once two slots' worth of cash is idle
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
