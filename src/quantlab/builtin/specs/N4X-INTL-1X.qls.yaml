# Next research after M15 (plan v0.3): do the prior project's N4 oversold-rebound rules carry an
# edge WITHOUT leverage on markets the prior project never tested?
# The five legs are copied as recorded in the handoff (§3-4: b32 S2, b31 D3, b36 B4, b47 Y2, b55 F3)
# and frozen; nothing here was tuned. Differences from the original, all fixed in advance:
#   * signals are read on each country ETF itself and that ETF is bought (no 3x ETF);
#   * decide at the close, fill at the next open (original: 15:55 decide, 15:59 fill);
#   * one-way cost 25bp + 5bp slippage (user's standing rule).
# Caveat: the prior project saw EFA and EEM (b35), which overlap these countries, so the
# evidence is only partly independent; the forward period after 2026-10-15 is fully clean.
spec_version: 1
strategy:
  id: N4X-INTL-1X
  version: 1.0.0
  name: 해외 선진국 지수 ETF 과매도 반등 묶음 (N4 규칙 고정, 레버리지 없음)
  type: mean_reversion
  author: claude
  parent: null
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Short-term overreaction in broad equity indices after sharp declines (Connors & Alvarez 2009):
    liquidity providers are paid to absorb forced and stop-loss selling, so prices partly revert
    within days. If this is a property of index markets rather than of US data mined by the prior
    project (100+ rules tried), it should also appear in other developed markets.
  expected_risks:
    - costs (0.6% round trip) larger than the unlevered per-trade edge
    - persistent declines (2008, 2011, 2022) where every leg buys too early
    - all five legs express one idea, so they lose together
    - prior selection on US data; EFA/EEM were partly seen
  falsification: >
    On the holdout (2017-01 onward), net Sharpe not above EFA buy-and-hold with block-bootstrap
    p < 0.10, or max drawdown above 80% of EFA's. Trade-level: gross mean per trade not above zero.
