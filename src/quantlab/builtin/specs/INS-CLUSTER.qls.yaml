# Insider purchase clusters in S&P 500 stocks (D-026). Fixed 2026-10-16 before any insider data was
# downloaded or read, by Claude or the app. Nothing is searched: one rule, one trial.
# The stock prices (S&P 500 members since 2010) were seen by the user's earlier project; insider
# filings were never used there. The verdict reads the 2020+ holdout once, from the home page.
spec_version: 1
strategy:
  id: INS-CLUSTER
  version: 1.0.0
  name: 내부자 여러 명 매수 따라가기 (S&P 500, 20일 보유)
  type: event
  author: claude
  parent: null
  derived_after_holdout_view: false
hypothesis:
  class: theory
  economic_rationale: >
    Officers and directors know their firm better than outside investors. Open-market purchases with
    their own money are a costly signal, and purchases by several insiders at once carry more
    information than one (Lakonishok & Lee 2001; Cohen, Malloy & Pomorski 2012). Filings become
    public within two business days, and prices may adjust slowly after them.
  expected_risks:
    - large S&P 500 firms have few insider purchases, so trades may be few and clustered in crashes
    - the effect is documented mostly in small stocks; in large caps it may be too small for 0.6% round-trip costs
    - insiders often buy after a fall; a 20-day hold can catch the rest of the fall
  falsification: >
    On the holdout (2020-01 onward), net Sharpe not above SPY buy-and-hold with block-bootstrap p < 0.10,
    or max drawdown above 80% of SPY's. Trade level: net mean per trade at or below 0.
universe:
  market: US_STOCK
  index: SP500
  symbols: [SPY, BIL]
  frequency: daily
rules:
  kind: declarative
  insider:
    roles: [officer, director]
    min_value: 10000
    min_insiders: 2
    window_days: 30
    hold_days: 20
    slots: 10
    park: SPY
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
parameters: {}
benchmark: SPY_buy_and_hold
costs: {one_way_bps: 30}   # informational; the validation policy's costs are binding
validation:
  policy: ins_cluster_v1
