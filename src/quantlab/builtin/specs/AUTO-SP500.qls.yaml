# Generator spec of the automatic strategy search on S&P 500 stocks (D-028). Its parameters pick
# 1 to 3 entry conditions from different groups (quantlab.strategies.stock_combo, catalog 1), a
# holding period, a stop, a take and the number of slots; every combination is one registered trial.
# The search runs on TRAIN+VALIDATION only. A candidate is this spec with its parameters fixed
# (후보 확정), and only the user starts its final evaluation.
spec_version: 1
strategy:
  id: AUTO-SP500
  version: 1.0.0
  name: 자동 탐색 · S&P 500 종목
  type: event
  author: claude
  parent: null
  derived_after_holdout_view: false
hypothesis:
  class: data_mining
  economic_rationale: >
    Stock-level events and states (earnings reactions, insider purchases, sharp drops, oversold RSI,
    opening gaps, long-term trend, the market's trend, 52-week highs), alone or two or three at once,
    on point-in-time S&P 500 members. Single events gave a per-trade edge over SPY below the 0.6%
    round-trip cost (PEAD-SP500 +0.62%, INS-CLUSTER +0.23%); stacking conditions may select fewer
    trades with a larger edge. No single rule is claimed in advance: only combinations that clear
    cost, consistency and multiple-testing filters become candidates.
  expected_risks:
    - many trials make lucky combinations look good (corrected by the trial count)
    - signals bunch on market-wide days (earnings seasons, sell-offs), so trades are not independent
    - 0.6% round-trip cost removes small edges
    - holding SPY between trades adds its drawdowns to the rule's
    - the price bundle and SEC filings are free sources checked only by counts
  falsification: >
    On the holdout (2020-01 onward), net Sharpe not above SPY buy-and-hold with block-bootstrap
    p < 0.10, or max drawdown above 80% of SPY's.
universe:
  market: US_STOCK
  index: SP500
  symbols: [SPY, BIL]
  frequency: daily
rules:
  kind: declarative
  stock_combo:
    catalog: 1
    park: SPY                  # equity not in a position is held in SPY
    park_band: 2               # SPY is bought back only once two slots' worth of cash is idle
execution:
  signal_time: close
  fill: next_open
  rebalance: daily
