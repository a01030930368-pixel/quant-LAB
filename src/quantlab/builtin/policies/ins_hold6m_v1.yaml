# Validation policy for INS-HOLD6M (D-036), written 2026-10-22 before the six-month hold was run.
# Splits follow the event-study plan (TRAIN 2010-2015, VALIDATION 2016-2019, holdout 2020-).
# Costs and gates are the project's standing ones (0.25% one-way + 0.05% slippage; Gate 3 vs SPY).
# Frozen: the registry stores its hash; changing anything requires version: 2.
policy_id: ins_hold6m
version: 1
strategy_family: INS-HOLD6M
universe: [SP500, SPY, BIL]
benchmark_symbol: SPY
risk_free_symbol: BIL
initial_cash: 100000

splits:
  train: ["2010-01-01", "2015-12-31"]
  validation: ["2016-01-01", "2019-12-31"]
  holdout: ["2020-01-01", null]
  forward_holdout_start: "2026-10-23"

costs:
  commission_bps: 25.0          # user's standing rule (0.25% one-way)
  slippage_bps: 5.0
  fixed_fee: 0.0

gate1:
  leak_test_cutpoints: 5
  leak_test_seed: 20261022

gate2:
  min_sharpe_diff: -0.10
  max_mdd_ratio: 0.90
  rule: "PASS if sharpe_diff >= min_sharpe_diff OR mdd_ratio <= max_mdd_ratio, else FAIL"

gate3:
  min_sharpe_diff: 0.0
  bootstrap: {block: 63, n_boot: 10000, seed: 20261022, max_p_value: 0.10}
  max_mdd_ratio: 0.80
  min_position_changes: 6
  min_sessions: 504

gate4_partial:
  stress_cost_multiplier: 2.0
  stress_min_sharpe_diff: 0.0
  neighbor_params: {}            # one pre-fixed rule; nothing is searched
  neighbor_min_sharpe_diff: 0.0
