# Validation policy for GAP-EARN-SP500 (D-029): one pre-fixed rule from the AUTO-SP500 search,
# written 2026-10-17 before any run of it. Splits, costs and gates are auto_sp500_v1's unchanged.
# prior_trials counts the AUTO-SP500 search (41,850) and INS-CLUSTER, PEAD-SP500 in the final
# evaluation's trial count. The holdout of these stocks is shared with the search (SHARED_HOLDOUT).
# Frozen: the registry stores its hash; changing anything requires version: 2.
policy_id: gap_earn
version: 1
strategy_family: GAP-EARN-SP500
prior_trials: 41852
universe: [SP500, SPY, BIL]
benchmark_symbol: SPY
risk_free_symbol: BIL
initial_cash: 100000

splits:
  train: ["2010-01-01", "2015-12-31"]
  validation: ["2016-01-01", "2019-12-31"]
  holdout: ["2020-01-01", null]
  forward_holdout_start: "2026-10-17"

costs:
  commission_bps: 25.0          # user's standing rule (0.25% one-way)
  slippage_bps: 5.0
  fixed_fee: 0.0

gate1:
  leak_test_cutpoints: 5
  leak_test_seed: 20261016

gate2:
  min_sharpe_diff: -0.10
  max_mdd_ratio: 0.90
  rule: "PASS if sharpe_diff >= min_sharpe_diff OR mdd_ratio <= max_mdd_ratio, else FAIL"

gate3:
  min_sharpe_diff: 0.0
  bootstrap: {block: 63, n_boot: 10000, seed: 20261016, max_p_value: 0.10}
  max_mdd_ratio: 0.80
  min_position_changes: 6
  min_sessions: 504

gate4_partial:
  stress_cost_multiplier: 2.0
  stress_min_sharpe_diff: 0.0
  neighbor_params: {}            # the search's neighbours were checked during AUTO-SP500
  neighbor_min_sharpe_diff: 0.0
