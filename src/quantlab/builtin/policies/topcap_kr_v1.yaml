# Validation policy for TOPCAP-KR (D-044), written 2026-11-01 before the rule was run.
# Costs as the Korean stock rounds (auto_krstk_v1): Kiwoom domestic 0.015% each way (confirmed by the
# user 2026-10-26), 0.20% securities transaction tax on stock sales (2026 rate), 0.10% slippage; KODEX
# 200 sales are tax-free. Splits as the Korean stock rounds. The KRTOP300 holdout (2020 onward) was read
# by D-039, so a final evaluation here is not blind; this rule is judged on 2010-2019 and forward records.
# Frozen: the registry stores its hash; changing anything requires version: 2.
policy_id: topcap_kr
version: 1
strategy_family: TOPCAP-KR
universe: [KRTOP300, "069500"]
benchmark_symbol: "069500"
risk_free_symbol: null
initial_cash: 100000000

splits:
  train: ["2010-01-01", "2015-12-31"]
  validation: ["2016-01-01", "2019-12-31"]
  holdout: ["2020-01-01", null]
  forward_holdout_start: "2026-11-02"

costs:
  commission_bps: 1.5
  slippage_bps: 10.0
  fixed_fee: 0.0
  sell_tax_bps: 20.0
  tax_exempt: ["069500"]

gate1:
  leak_test_cutpoints: 5
  leak_test_seed: 20261101

gate2:
  min_sharpe_diff: -0.10
  max_mdd_ratio: 0.90
  rule: "PASS if sharpe_diff >= min_sharpe_diff OR mdd_ratio <= max_mdd_ratio, else FAIL"

gate3:
  min_sharpe_diff: 0.0
  bootstrap: {block: 63, n_boot: 10000, seed: 20261101, max_p_value: 0.10}
  max_mdd_ratio: 0.80
  min_position_changes: 6
  min_sessions: 504

gate4_partial:
  stress_cost_multiplier: 2.0
  stress_min_sharpe_diff: 0.0
  neighbor_params: {top_n: [5, 20]}   # fixed with the rule; nothing is searched
  neighbor_min_sharpe_diff: 0.0
