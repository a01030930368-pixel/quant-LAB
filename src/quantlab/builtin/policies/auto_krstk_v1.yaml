# Validation policy for AUTO-KRSTK (D-038): round 3 of the research factory, on Korean stocks (KRTOP300,
# the 300 largest common stocks of KOSPI and KOSDAQ, point in time), compared with KODEX 200 (069500)
# buy-and-hold. Written 2026-10-22 before any Korean stock data was downloaded by the app or seen by Claude.
# Prices: the exchange's daily snapshots (KRX Open API), adjusted with its own base price; dividends left
# out on both sides (price returns). Pre-tax.
# Costs: Kiwoom domestic online commission 0.015% each way (default rate; not yet checked against the
# user's account), securities transaction tax 0.20% on stock sales (the 2026 rate, KOSPI 0.05% + rural
# special tax 0.15%, KOSDAQ 0.20%; applied to every year, as the user would pay it now), 0.10% slippage
# each way. KODEX 200 sales are tax-free (ETF). Round trip about 0.43%; every result must also survive
# twice the commission and slippage. Gross bar 0.9% per trade over KODEX 200 (about twice the round trip).
# Idle equity is held in KODEX 200, as SPY in the S&P 500 rounds; no KRW cash fund lists before 2012,
# so cash earns 0 (risk_free_symbol null).
# Splits: TRAIN 2010-2015, VALIDATION 2016-2019, HOLDOUT 2020 onward. prior_trials 0: a new market and
# new stocks. Disclosed: the KOSPI's path was already seen through KORU (AUTO-LEV/LEVP, 2013 on) and the
# KRX 2x ETFs (AUTO-KR2X, TRAIN+VALIDATION 2010-2021), so this holdout is blind for the stocks, not for
# the market.
# Frozen: the registry stores its hash; changing anything requires version: 2.
policy_id: auto_krstk
version: 1
strategy_family: AUTO-KRSTK
universe: [KRTOP300, "069500"]
benchmark_symbol: "069500"
risk_free_symbol: null
initial_cash: 100000000

splits:
  train: ["2010-01-01", "2015-12-31"]
  validation: ["2016-01-01", "2019-12-31"]
  holdout: ["2020-01-01", null]
  forward_holdout_start: "2026-10-26"

costs:
  commission_bps: 1.5           # Kiwoom domestic online (default rate)
  slippage_bps: 10.0
  fixed_fee: 0.0
  sell_tax_bps: 20.0            # securities transaction tax on stock sales (2026 rate)
  tax_exempt: ["069500"]        # ETF sales carry no transaction tax

gate1:
  leak_test_cutpoints: 5
  leak_test_seed: 20261022

gate2:
  min_sharpe_diff: -0.10
  max_mdd_ratio: 0.90
  rule: "PASS if sharpe_diff >= min_sharpe_diff OR mdd_ratio <= max_mdd_ratio, else FAIL"

gate3:
  min_sharpe_diff: 0.0
  bootstrap: {block: 63, n_boot: 10000, seed: 20261022, max_p_value: 0.10}
  max_mdd_ratio: 0.80
  min_position_changes: 6
  min_sessions: 504

gate4_partial:
  stress_cost_multiplier: 2.0
  stress_min_sharpe_diff: 0.0
  neighbor_params: {}            # neighbours are checked during the search (TRAIN+VALIDATION), see auto_search
  neighbor_min_sharpe_diff: 0.0

auto_search:
  trials_per_run: 3000
  order: affine                 # fixed affine walk of the full grid; each run takes the next untried combinations
  order_seed: 20261022
  prior_trials: 0
  min_trades_train: 40
  min_trades_validation: 20
  min_gross_per_trade: 0.009    # before costs, over KODEX 200: about twice the 0.43% round trip
  stress_cost_multiplier: 2.0   # CAGR must stay above 0 at twice the costs
  max_drawdown_floor: -0.35
  beat_symbol: "069500"
  beat_metric: cagr             # CAGR (rule + KODEX 200 on idle equity) above KODEX 200 buy-and-hold's
  park_symbol: "069500"         # idle equity is held in KODEX 200 (spec: rules.stock_combo.park)
  versus: "069500"              # per-trade gross, top-10 and t-value read the return over KODEX 200
  alpha: 0.05                   # one-sided; Bonferroni over the family's trial count
  neighbour_min_share: 0.5
