name: windows-app

# Builds the Windows desktop app on a clean runner and proves it works without a Python
# installation on PATH: the packaged QuantLab.exe must pass --selftest (synthetic data,
# full flow, no network). Plan M14.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Build app
        run: uv run pyinstaller packaging/QuantLab.spec --noconfirm --distpath dist --workpath build
      - name: Self-test the packaged app (no Python on PATH)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python|uv|\.venv' }) -join ';'
          $env:QUANTLAB_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process -FilePath "dist\QuantLab\QuantLab.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content $env:QUANTLAB_SELFTEST_LOG
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Add build info and updater
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref }}" -eq "refs/heads/main") { "build-${{ github.run_number }}" } else { "dev-${{ github.run_number }}" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sha = "${{ github.sha }}".Substring(0, 7)
          "$tag`ncommit $sha`nbuilt $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC" | Set-Content dist\QuantLab\build-info.txt -Encoding utf8
          Copy-Item packaging\update.bat, packaging\update.ps1 dist\QuantLab\
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\QuantLab -DestinationPath QuantLab-windows.zip
      - name: Test the updater on an older install (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          # every check reports through one annotation, readable without the raw log
          $log = [System.Collections.Generic.List[string]]::new()
          function Fail($why) { $log.Add("FAIL: $why"); Write-Host "::error title=updater test::$($log -join '%0A')"; exit 1 }
          try {
            $inst = "$env:RUNNER_TEMP\installed\QuantLab"
            New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\installed" -Force | Out-Null
            Copy-Item dist\QuantLab $inst -Recurse
            "build-0" | Set-Content "$inst\build-info.txt"
            "keep me" | Set-Content "$inst\user-note.txt"
            "stale" | Set-Content "$inst\_internal\stale-file.txt"   # must be gone after the swap
            $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$inst\update.ps1" -ZipPath "$PWD\QuantLab-windows.zip" -NoPause -NoLaunch 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { $log.Add("$_") }
            if ($code -ne 0) { Fail "updater exit code $code" }
            $now = (Get-Content "$inst\build-info.txt" | Select-Object -First 1).Trim()
            if ($now -ne $env:TAG) { Fail "build-info is '$now', expected $env:TAG" }
            if (-not (Test-Path "$inst\user-note.txt")) { Fail "updater removed a user file" }
            if (Test-Path "$inst\_internal\stale-file.txt") { Fail "old _internal was not replaced" }
            $env:QUANTLAB_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest-updated.log"
            $q = Start-Process -FilePath "$inst\QuantLab.exe" -ArgumentList "--selftest" -Wait -PassThru
            if ($q.ExitCode -ne 0) { Get-Content $env:QUANTLAB_SELFTEST_LOG | ForEach-Object { $log.Add($_) }; Fail "updated app selftest exit $($q.ExitCode)" }
            $log.Add("updated app selftest OK")
            Write-Host "::notice title=updater test::$($log -join '%0A')"
          } catch { Fail $_.Exception.Message }
      - uses: actions/upload-artifact@v4
        with:
          name: QuantLab-windows
          path: QuantLab-windows.zip
          retention-days: 30
